<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hypersocial</title>
<style>
  :root {
    --bg: #0f1a1f; --bg2: #1b2429; --line: #273035; --text: #f6fefd; --text2: #d2dad7; --muted: #949e9c;
    --long: #50d2c1; --short: #ed7088; --view: #8aa4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text2); }
  body { width: 320px; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 20px; height: 20px; }
  header b { color: var(--text); font-size: 14px; font-weight: 600; }
  header small { color: var(--muted); margin-left: auto; }
  section { padding: 12px 14px; }
  section + section { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 10px; }
  .title { color: var(--text); font-size: 13px; }
  .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .sw { margin-left: auto; position: relative; width: 36px; height: 20px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; pointer-events: none; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .sw input:checked + i { background: var(--long); }
  .sw input:checked + i::after { transform: translateX(16px); background: var(--bg); }
  .sw input:focus-visible + i { outline: 2px solid var(--text2); outline-offset: 2px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 10px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; color: var(--text2); text-align: right; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
  .live { color: var(--long); } .fixture { color: var(--view); } .mock, .error { color: var(--short); }
  .msg { margin-top: 8px; color: var(--muted); font-size: 11px; }
  .msg.bad { color: var(--short); }
  button { width: 100%; margin-top: 12px; border: 0; border-radius: 6px; padding: 9px 0; font: inherit; font-size: 13px; font-weight: 500; background: var(--long); color: var(--bg); cursor: pointer; }
  button:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .off .dim { opacity: .45; }
  label.f { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  input[type=url] { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; padding: 7px 9px; }
  input[type=url]:focus { outline: none; border-color: var(--long); }
  .btns { display: flex; gap: 8px; }
  .btns button { margin-top: 8px; }
  button.ghost { background: transparent; color: var(--text2); border: 1px solid var(--line); }
  button.ghost:hover:not(:disabled) { border-color: var(--long); color: var(--long); }
  .res { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .res.ok { color: var(--long); } .res.bad { color: var(--short); }
  .note { margin-top: 6px; font-size: 11px; color: var(--view); }
</style>
</head>
<body>
  <header><img src="icons/48.png" alt=""><b>hypersocial</b><small id="ver"></small></header>
  <section>
    <div class="row">
      <div>
        <div class="title">Show on Hyperliquid</div>
        <div class="sub">Pins on the chart, Signals and Trader Analytics tabs</div>
      </div>
      <label class="sw"><input id="on" type="checkbox" role="switch" aria-label="Show on Hyperliquid"><i></i></label>
    </div>
  </section>
  <section class="dim">
    <div class="row"><div class="title">Data source</div><span class="sp" style="flex:1"></span><span id="src" class="badge">—</span></div>
    <dl>
      <dt>Calls</dt><dd id="calls">—</dd>
      <dt>Coin · window</dt><dd id="cw">—</dd>
      <dt>Data updated</dt><dd id="upd">—</dd>
      <dt>Last fetch</dt><dd id="fetched">—</dd>
    </dl>
    <div id="cov" class="note" hidden></div>
    <div id="msg" class="msg"></div>
    <button id="refresh">Refresh data</button>
  </section>
  <section>
    <label class="f" for="url">Backend URL</label>
    <input id="url" type="url" spellcheck="false" placeholder="http://localhost:8787">
    <div class="btns">
      <button id="save" class="ghost">Save</button>
      <button id="test" class="ghost">Test connection</button>
    </div>
    <div id="res" class="res">Run your own backend (twitterapi.io or X API). Hosts other than localhost ask for permission on save.</div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
